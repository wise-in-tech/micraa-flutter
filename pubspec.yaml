name: micraa_flutter
description: Micraa - Live Classroom Audio App
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client pour l'API REST
  http: ^1.2.0

  # LiveKit Flutter SDK (WebRTC audio)
  livekit_client: ^2.3.0

  # Permissions (microphone)
  permission_handler: ^11.3.0

  # State management
  provider: ^6.1.2

  # UI
  cupertino_icons: ^1.0.6
  flutter_spinkit: ^5.2.0

  # Secure storage for JWT
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
